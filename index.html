<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie & K-Drama Stream</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #fff;
        }

        /* Header & Navbar */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
        }

        header h1 {
            color: #e50914;
            font-size: 24px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box input, .search-box select {
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            outline: none;
            background: #333;
            color: #fff;
        }

        .search-box input {
            width: 180px;
        }

        .search-box button, .back-btn-top {
            padding: 8px 15px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .server-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .server-controls select {
            padding: 6px 12px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .audio-tip {
            font-size: 12px;
            color: #ffc107;
            background: rgba(255,193,7,0.1);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ffc107;
        }

        #player-container iframe {
            width: 90%;
            height: 75%;
            border: none;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
        }

        /* Movies Grid */
        .container {
            padding: 20px 5%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .type-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(229, 9, 20, 0.9);
            padding: 3px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            font-size: 11px;
            color: #ffc107;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="getTrendingContent()">MY STREAM</h1>
        
        <div class="search-box">
            <button class="back-btn-top" onclick="getTrendingContent()">🏠 Home / Trending</button>

            <select id="type-select">
                <option value="multi">All Content</option>
                <option value="movie">Movies Only</option>
                <option value="tv">K-Dramas & Series</option>
            </select>

            <input type="text" id="search-input" placeholder="Search Movie or Drama...">
            <button id="search-btn">Search</button>
        </div>
    </header>

    <!-- Modal Player -->
    <div id="player-container">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        
        <div class="server-controls">
            <label style="font-weight: bold;">Server: </label>
            <select id="server-select" onchange="changeServer()">
                <option value="autoembed">Server 1 (AutoEmbed - Best for Hindi/Multi-Audio)</option>
                <option value="vidsrc_in">Server 2 (VidSrc In)</option>
                <option value="vidsrc_me">Server 3 (VidSrc Me)</option>
                <option value="vidsrc_cc">Server 4 (VidSrc CC)</option>
                <option value="smashy">Server 5 (SmashyStream)</option>
            </select>
            <span class="audio-tip">💡 Tip: Player Settings ⚙️ se Audio "Hindi" select karein.</span>
        </div>

        <iframe id="video-iframe" src="" allowfullscreen></iframe>
    </div>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title" id="heading">Trending Movies & K-Dramas</h2>
        </div>
        <div class="movies-grid" id="movies-grid"></div>
    </div>

    <script>
        const API_KEY = '203a80846675dc5aec6ff3961867f1a3'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_PATH = 'https://image.tmdb.org/t/p/w500';

        const moviesGrid = document.getElementById('movies-grid');
        const playerContainer = document.getElementById('player-container');
        const videoIframe = document.getElementById('video-iframe');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const typeSelect = document.getElementById('type-select');

        let currentMediaId = '';
        let currentMediaType = '';

        // Search Events
        searchBtn.addEventListener('click', searchContent);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') searchContent();
        });

        // Fetch Trending Content
        async function getTrendingContent() {
            document.getElementById('heading').innerText = 'Trending Movies & K-Dramas';
            moviesGrid.innerHTML = '<p style="color:#fff;">Loading content...</p>';
            searchInput.value = '';

            try {
                const res = await fetch(`${BASE_URL}/trending/all/week?api_key=${API_KEY}`);
                const data = await res.json();
                displayResults(data.results);
            } catch (err) {
                console.error("Error loading trending content:", err);
            }
        }

        // Search Content
        async function searchContent() {
            const query = searchInput.value.trim();
            const searchType = typeSelect.value;

            if (!query) {
                getTrendingContent();
                return;
            }

            document.getElementById('heading').innerText = `Results for: "${query}"`;
            moviesGrid.innerHTML = '<p style="color:#fff;">Searching...</p>';

            try {
                const url = `${BASE_URL}/search/${searchType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    displayResults(data.results);
                } else {
                    moviesGrid.innerHTML = '<p style="color:#e50914; font-size: 18px;">No content found!</p>';
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        // Display Results
        function displayResults(items) {
            moviesGrid.innerHTML = '';
            items.forEach(item => {
                const title = item.title || item.name;
                const mediaType = item.media_type || (item.first_air_date ? 'tv' : 'movie');
                
                if (!item.poster_path) return;

                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.onclick = () => playMedia(item.id, mediaType);

                card.innerHTML = `
                    <span class="type-badge">${mediaType === 'tv' ? 'Series / K-Drama' : 'Movie'}</span>
                    <img src="${IMAGE_PATH + item.poster_path}" alt="${title}">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-rating">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });
        }

        // Play Video Function
        function playMedia(id, type) {
            currentMediaId = id;
            currentMediaType = type;
            document.getElementById('server-select').value = 'autoembed';
            loadServerUrl('autoembed');
            playerContainer.style.display = 'flex';
        }

        // Change Server Logic
        function changeServer() {
            const selectedServer = document.getElementById('server-select').value;
            loadServerUrl(selectedServer);
        }

        function loadServerUrl(serverKey) {
            let embedUrl = '';
            const id = currentMediaId;
            const isTv = currentMediaType === 'tv';

            if (serverKey === 'autoembed') {
                embedUrl = isTv ? `https://player.autoembed.cc/embed/tv/${id}/1/1` : `https://player.autoembed.cc/embed/movie/${id}`;
            } else if (serverKey === 'vidsrc_in') {
                embedUrl = isTv ? `https://vidsrc.in/embed/tv/${id}/1/1` : `https://vidsrc.in/embed/movie/${id}`;
            } else if (serverKey === 'vidsrc_me') {
                embedUrl = isTv ? `https://vidsrc.me/embed/tv?tmdb=${id}&season=1&episode=1` : `https://vidsrc.me/embed/movie?tmdb=${id}`;
            } else if (serverKey === 'vidsrc_cc') {
                embedUrl = isTv ? `https://vidsrc.cc/v2/embed/tv/${id}/1/1` : `https://vidsrc.cc/v2/embed/movie/${id}`;
            } else if (serverKey === 'smashy') {
                embedUrl = isTv ? `https://embed.smashystream.com/playere.php?tmdb=${id}&season=1&episode=1` : `https://embed.smashystream.com/playere.php?tmdb=${id}`;
            }

            videoIframe.src = embedUrl;
        }

        // Close Video Player
        function closePlayer() {
            videoIframe.src = '';
            playerContainer.style.display = 'none';
        }

        // Initialize Page
        getTrendingContent();
    </script>
</body>
</html>
