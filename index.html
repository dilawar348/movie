<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sticky Love - Hindi Stream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #e50914; margin-bottom: 10px; }
        p { color: #ccc; margin-bottom: 20px; }
        
        .episode-btn-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px;
        }
        .ep-btn {
            padding: 10px 18px; background: #222; border: 1px solid #e50914; color: #fff;
            border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .ep-btn:hover, .ep-btn.active { background: #e50914; }

        .player-box {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            max-width: 900px; margin: 0 auto; border-radius: 10px; border: 2px solid #333; background: #000;
        }
        .player-box iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .tip {
            font-size: 13px; color: #ffc107; margin-top: 15px; background: rgba(255,193,7,0.1);
            display: inline-block; padding: 6px 15px; border-radius: 4px; border: 1px solid #ffc107;
        }
    </style>
</head>
<body>

    <h1>Our Sticky Love (K-Drama)</h1>
    <p>Niche diye gaye Episodes par click karke dekhein</p>

    <!-- Episode Buttons -->
    <div class="episode-btn-container">
        <button class="ep-btn active" onclick="playEpisode(1, this)">Episode 1</button>
        <button class="ep-btn" onclick="playEpisode(2, this)">Episode 2</button>
        <button class="ep-btn" onclick="playEpisode(3, this)">Episode 3</button>
        <button class="ep-btn" onclick="playEpisode(4, this)">Episode 4</button>
    </div>

    <!-- Working Video Player -->
    <div class="player-box">
        <iframe id="videoPlayer" src="https://vidsrc.cc/v2/embed/tv/244304/1/1" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <div class="tip">💡 Note: Video play hone par agar English/Other Audio aaye toh player controls mein ⚙️ Settings par click karke Audio "Hindi" select karein.</div>

    <script>
        // TMDB ID for Our Sticky Love is 244304
        function playEpisode(epNum, btn) {
            document.getElementById('videoPlayer').src = "https://vidsrc.cc/v2/embed/tv/244304/1/" + epNum;
            
            let buttons = document.querySelectorAll('.ep-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
