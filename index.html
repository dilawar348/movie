<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sticky Love - Hindi Dubbed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #e50914; margin-bottom: 10px; }
        p { color: #ccc; margin-bottom: 20px; }
        
        .episode-btn-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px;
        }
        .ep-btn {
            padding: 10px 18px; background: #222; border: 1px solid #e50914; color: #fff;
            border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .ep-btn:hover, .ep-btn.active { background: #e50914; }

        .player-box {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            max-width: 900px; margin: 0 auto; border-radius: 10px; border: 2px solid #333; background: #000;
        }
        .player-box iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
    </style>
</head>
<body>

    <h1>Our Sticky Love (Hindi Dubbed)</h1>
    <p>Niche diye gaye Episodes par click karke dekhein (100% Smooth & Hindi)</p>

    <!-- Episode Switching Buttons -->
    <div class="episode-btn-container">
        <button class="ep-btn active" onclick="playEpisode('3330411', this)">Episode 1</button>
        <button class="ep-btn" onclick="playEpisode('3330697', this)">Episode 4</button>
    </div>

    <!-- Clean Video Player -->
    <div class="player-box">
        <iframe id="videoPlayer" src="https://www.febspot.com/embed/3330411" allowfullscreen></iframe>
    </div>

    <script>
        function playEpisode(febspotId, btn) {
            // Update iframe src
            document.getElementById('videoPlayer').src = "https://www.febspot.com/embed/" + febspotId;
            
            // Highlight active button
            let buttons = document.querySelectorAll('.ep-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
